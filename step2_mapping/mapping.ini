# Morph-KGC configuration. Paths are relative to the repo root (run_mapping.py runs from there).
# run_mapping.py calls morph_kgc.materialize_oxigraph() and writes the result as Turtle,
# with prefixes and grouping (Morph-KGC can only write N-Triples itself).
[CONFIGURATION]
na_values = ,nan,None,NaN

[ProcurementDB]
mappings = step2_mapping/mapping.r2rml.ttl
db_url = sqlite:///data/procurement.db
